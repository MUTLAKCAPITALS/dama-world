name: Verify free game update

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned emulator dependencies
        run: npm ci --prefix dev/firebase
      - name: Verify game behavior and traffic limits
        run: node dev/tests/run.cjs
      - name: Verify Firestore rules and aggregate counts
        run: npm test --prefix dev/firebase
